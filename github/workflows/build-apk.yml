name: Build Android APK

# Builds Onda into an APK you can install. Run it from the Actions tab: Build Android APK > Run workflow.
# Fork this repo first and run it in YOUR fork. Add your own signing secrets there to get a signed release APK
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS).
# Without secrets it builds a debug APK, which installs fine for personal use.
# Never put keys or passwords in the repo itself: this repo is public.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK (signed release when the signing secrets exist, otherwise debug)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          # Works whether the repo holds the project files or just onda-capacitor.zip
          if [ -f package.json ]; then
            PROJ="$PWD"
          else
            unzip -q "$(ls *.zip | head -1)" -d _src
            PROJ="$PWD/$(dirname "$(find _src -name package.json -not -path '*/node_modules/*' | head -1)")"
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          cd "$PROJ"
          npm install
          [ -d android ] || npx cap add android
          node scripts/patch-native.mjs
          npx cap sync android
          cd android
          chmod +x gradlew
          TASK=assembleDebug; APK_REL=debug/app-debug.apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/onda.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/onda.jks"
            VERSION_CODE="$RUN_NUMBER" VERSION_NAME="1.0.$RUN_NUMBER" node "$PROJ/scripts/sign-release.mjs" app/build.gradle
            TASK=assembleRelease; APK_REL=release/app-release.apk
          else
            echo "::warning::No signing secrets - building an UNSIGNED-for-store debug APK"
          fi
          echo "APK=$PROJ/android/app/build/outputs/apk/$APK_REL" >> "$GITHUB_ENV"
          echo "APK_NAME=$([ "$TASK" = assembleRelease ] && echo Onda-1.0.$RUN_NUMBER.apk || echo Onda-debug.apk)" >> "$GITHUB_ENV"
          built=0
          for i in 1 2; do
            ./gradlew $TASK --no-daemon && { built=1; break; } || { echo "Gradle attempt $i failed"; sleep 20; }
          done
          if [ "$built" = "0" ]; then
            echo "::warning::Full build failed - retrying WITHOUT the home-screen widget"
            (cd "$PROJ" && node scripts/patch-native.mjs --no-widget)
            ./gradlew $TASK --no-daemon && built=1 || sleep 20
          fi
          if [ "$built" = "0" ]; then
            echo "::warning::Still failing - retrying WITHOUT the widget and the earphone-balance / equalizer feature"
            cp "$PROJ/native/android/safe/OndaPlaybackService.java" app/src/main/java/com/erikasado/onda/OndaPlaybackService.java
            ./gradlew $TASK --no-daemon || { sleep 20; ./gradlew $TASK --no-daemon; }
          fi
          test -f app/build/outputs/apk/$APK_REL

      - uses: actions/upload-artifact@v4
        with:
          name: onda-apk
          path: ${{ env.APK }}

      - name: Publish to the "latest" release (download straight from your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          cp "${{ env.APK }}" "$APK_NAME"
          CERT=$(keytool -printcert -jarfile "$APK_NAME" 2>/dev/null | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//' || true)
          PKG=com.erikasado.onda
          NOTES="APK built by GitHub Actions ($APK_NAME)"
          if [ -n "$CERT" ]; then
            NOTES="$NOTES"$'\n\n'"Package name: $PKG"$'\n'"Signing certificate SHA-256: $CERT"
            { echo "### Signing certificate (for Google developer verification)"; echo; echo "Package name: \`$PKG\`"; echo; echo "SHA-256: \`$CERT\`"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          gh release create latest "$APK_NAME" \
            --title "Onda (latest build)" --notes "$NOTES" --prerelease
